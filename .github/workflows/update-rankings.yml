name: Update AITA Rankings

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aita-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch latest rankings
        run: python3 scripts/update_rankings.py
      - name: Commit changes
        run: |
          git config user.name "aita-rankings-bot"
          git config user.email "aita-rankings-bot@users.noreply.github.com"
          git add data.json history.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update rankings"
            git pull --rebase
            git push
          fi
