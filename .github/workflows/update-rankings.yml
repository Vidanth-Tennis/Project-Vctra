name: Update AITA Rankings

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and parse the latest rankings
        run: python3 scripts/update_rankings.py

      - name: Commit and push data.json if it changed
        run: |
          git config user.name "aita-rankings-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "No changes to data.json — nothing to publish."
          else
            git add data.json
            git commit -m "Auto-update AITA rankings ($(date -u +'%Y-%m-%d'))"
            git push
          fi
